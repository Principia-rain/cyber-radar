name: daily-collect

on:
  schedule:
    - cron: "30 2 * * *"   # 每日 02:30 UTC（北京 10:30 左右，Actions 可能有 0-1 小时延迟）
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 采集公开威胁情报
        run: python scripts/collect.py

      - name: 提交并推送数据
        run: |
          git config user.name "cyber-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "data: 每日采集 $(date -u +%F)"
            git push
          fi
